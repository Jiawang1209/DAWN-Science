import pandas as pd

# 按样地计算平均生物量
summary = df.groupby("site")["biomass"].mean()
print(summary)

# 绘制对比图

const escape=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function colored(text){return text.split('\n').map(line=>line.trimStart().startsWith('#')?'<span class="lc-comment">'+escape(line)+'</span>':line.split(/("[^"\n]*"|'[^'\n]*')/g).map((s,i)=>i%2?'<span class="lc-string">'+escape(s)+'</span>':escape(s).replace(/\b(import|from|as)\b/g,'<span class="lc-keyword">$1</span>')).join('')).join('\n')+'\n';}
let models=[];
function saveState(){if(!window.openai?.setWidgetState)return;const drafts=models.map(m=>({layout:m.kind,text:m.text,saved:m.saved,open:m.open,output:m.output,reply:m.q('.lc-reply').textContent.slice(0,300)})).filter(d=>new TextEncoder().encode(JSON.stringify(d)).length<4000);window.openai.setWidgetState({modelContent:{designs:['侧边对照','消息内编辑','临时专注'],interaction:models.filter(m=>m.interacted).map(m=>({design:m.name,edited:m.text!==initial,open:m.open})),recommended:'侧边对照'},privateContent:{v:2,drafts}}).catch(()=>{});}
for(const app of root.querySelectorAll('.lc-app')){
app.append(shell.content.cloneNode(true));const q=s=>app.querySelector(s);const kind=app.dataset.layout;
const editor=editorTemplate.content.cloneNode(true);(kind==='inline'?q('.lc-inline-slot'):q('.lc-editor-slot')).append(editor);
app.querySelectorAll('button').forEach(b=>b.classList.add('cursor-interaction'));
const m={app,q,kind,name:app.parentElement.dataset.variant,text:initial,saved:initial,open:true,output:false,run:null,selection:null,context:null,interacted:false};models.push(m);
const source=q('.lc-source');source.value=m.text;source.setSelectionRange(0,0);
q('.lc-open span').textContent=kind==='inline'?'直接修改这段代码':kind==='side'?'在旁边编辑':'打开专注编辑';
q('.lc-open').setAttribute('aria-label',q('.lc-open span').textContent);
q('.lc-file-path .lc-origin').textContent=kind==='focus'?'当前会话的代码 · 改完返回对话':'来自当前对话';
function paint(){q('.lc-colored code').innerHTML=colored(m.text);q('.lc-lines').textContent=m.text.split('\n').map((_,i)=>i+1).join('\n');q('.lc-colored').scrollTop=source.scrollTop;q('.lc-colored').scrollLeft=source.scrollLeft;q('.lc-lines').scrollTop=source.scrollTop;}
function render(){app.classList.toggle('lc-is-open',m.open);q('.lc-editor').hidden=!m.open;q('.lc-dirty').textContent=m.text===m.saved?'':'•';q('.lc-save-state').textContent=m.text===m.saved?'已保存（演示）':'未保存 · 草稿保留';q('.lc-save-state').style.color=m.text===m.saved?'':'var(--lc-warn)';q('.lc-stale').hidden=!m.run||m.run.snapshot===m.text;q('.lc-output').hidden=!m.output;q('.lc-context').hidden=!m.context;q('.lc-reply').hidden=!q('.lc-reply').textContent;paint();}
function select(){const start=source.selectionStart,end=source.selectionEnd;m.selection=end>start?{start,end,text:m.text.slice(start,end),snapshot:m.text}:null;const first=m.text.slice(0,start).split('\n').length;const last=m.text.slice(0,end).split('\n').length;q('.lc-selection-tools').hidden=!m.selection;q('.lc-selection-label').textContent='已选 L'+first+'–'+last;q('.lc-run span').textContent=m.selection?'运行选区':'运行';}
function notice(text){q('.lc-notice').textContent=text;}
function interact(){m.interacted=true;saveState();}
function close(){m.open=false;render();notice('已回到当前对话 · 编辑草稿保留');interact();}
function save(){m.saved=m.text;render();notice('脚本已保存（本页模拟）· 未自动运行');interact();}
function run(){const selected=m.selection&&m.selection.snapshot===m.text;const code=selected?m.selection.text:m.text;if(!code.trim()){notice('请先输入代码。');return;}m.run={snapshot:m.text,selection:!!selected};m.output=true;q('.lc-output-text').textContent=(selected?'选区':'全部脚本')+'运行演示 · 未执行真实代码\n\n示例结果：A 120.0　B 146.0　C 133.0\n'+(selected?'实际变量与输出取决于执行的选区。':'图表与完整输出在需要时展开。');render();notice('运行交互已演示 · 当前是预置示例输出');interact();}
q('.lc-open').addEventListener('click',()=>{m.open=true;render();notice(kind==='inline'?'代码就在这条消息里，改完继续聊。':kind==='side'?'对话保持原位 · 代码在旁边打开。':'临时专注编辑 · 随时回到原会话。');interact();});
q('.lc-close').addEventListener('click',close);q('.lc-return').addEventListener('click',close);q('.lc-save').addEventListener('click',save);q('.lc-run').addEventListener('click',run);
source.addEventListener('input',()=>{m.text=source.value;paint();select();render();interact();});source.addEventListener('select',select);source.addEventListener('keyup',select);source.addEventListener('click',select);source.addEventListener('scroll',paint);
source.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='s'){e.preventDefault();save();}if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){e.preventDefault();select();run();}if(e.key==='Tab'){e.preventDefault();source.setRangeText('    ',source.selectionStart,source.selectionEnd,'end');source.dispatchEvent(new Event('input'));}});
q('.lc-toggle-output').addEventListener('click',()=>{m.output=!m.output;render();interact();});
q('.lc-ask').addEventListener('click',()=>{if(!m.selection)return;const s=m.selection;const first=m.text.slice(0,s.start).split('\n').length;const last=m.text.slice(0,s.end).split('\n').length;m.context={...s};q('.lc-context-label').textContent='analysis.py · L'+first+'–'+last;q('.lc-chat-input').value='请帮我检查这段统计代码的缺失值处理。';if(kind==='focus')m.open=false;render();q('.lc-chat-input').focus();notice('选区已附加到原会话输入框 · 尚未发送');interact();});
q('.lc-remove-context').addEventListener('click',()=>{m.context=null;render();interact();});
q('.lc-send').addEventListener('click',()=>{const input=q('.lc-chat-input');if(!input.value.trim()){notice('可以输入分析要求，或从编辑器附加选区。');return;}q('.lc-reply').textContent=m.context?'已附加 analysis.py 的选区与草稿快照。真实实现会在这段会话中回复修改建议，确认后再应用到代码。（本页未调用 AI）':'会话输入交互演示：你可以继续讨论分析，也可以随时打开同一份代码草稿。（本页未调用 AI）';input.value='';m.context=null;render();notice('消息发送为本页演示 · 未调用模型');interact();});
m.apply=s=>{if(s){if(typeof s.text==='string')m.text=s.text;if(typeof s.saved==='string')m.saved=s.saved;m.open=typeof s.open==='boolean'?s.open:true;m.output=!!s.output;if(typeof s.reply==='string')q('.lc-reply').textContent=s.reply;source.value=m.text;source.setSelectionRange(0,0);}render();};m.apply();
if(globalThis.Tweak&&kind==='side'){const prefs={editorWidth:46};const tweak=new Tweak({container:app,onChange:()=>{app.style.setProperty('--lc-code-width',prefs.editorWidth+'%');}});tweak.addSlider(prefs,'editorWidth',{label:'代码页宽度',min:38,max:58,step:2,unit:'%'});}
}
function restore(state){if(state?.privateContent?.v!==2)return;for(const s of state.privateContent.drafts||[])models.find(m=>m.kind===s.layout)?.apply(s);}
restore(window.openai?.widgetState);window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState)restore(e.detail.globals.widgetState);});
})();
</script>
