# One-time repair: copy the verified main build into the existing v0.0.39 Release.
name: Restore v0.0.39 macOS release assets
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  restore:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Download verified macOS build from GitHub Actions
        uses: actions/download-artifact@v4
        with:
          name: dawn-science-mac
          run-id: 40866568856
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts
      - name: Verify provenance, complete Release assets and update notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          tag = 'v0.0.39'
          source_sha = 'e9e9ed1312b126be75c5ed319c3cd091c0440071'
          expected = {
              'DAWN-Science-0.0.39-mac-arm64.dmg': (238409427, 'e0b647ba1e3f1301dd67d149365d1e860d58ef35b454a6c28ae5fb262c30ba30'),
              'DAWN-Science-0.0.39-mac-arm64.zip': (252780426, '25ee5378692bcd24abc69d5d6d15a23fd69b7f6a92e1a0a6c4563d42d6b86645'),
              'DAWN-Science-0.0.39-mac-x64.dmg': (242199294, '4cbffe969b05e051034a8c9c06bc02582c41defa90fe0b8caae35cb41624bfa1'),
              'DAWN-Science-0.0.39-mac-x64.zip': (256621673, 'db5062e25e22ae64af164a7812b65bc820d541f877d3bbfedf731da9ef09a9f3'),
          }

          def run(*args):
              return subprocess.check_output(args, text=True).strip()

          def release():
              return json.loads(run('gh', 'release', 'view', tag, '--repo', repo, '--json', 'body,assets,url'))

          source = json.loads(run('gh', 'api', f'repos/{repo}/actions/runs/40866568856'))
          assert source['conclusion'] == 'success' and source['head_branch'] == 'main'
          assert source['head_sha'] == source_sha
          run('git', 'fetch', '--no-tags', '--depth=1', 'origin', f'refs/tags/{tag}:refs/tags/{tag}', source_sha)
          changed = run('git', 'diff', '--name-only', tag, source_sha).splitlines()
          assert set(changed) == {'.github/workflows/ci.yml', '.github/workflows/release.yml'}, changed
          assert json.loads(run('git', 'show', f'{source_sha}:package.json'))['version'] == '0.0.39'
          assert sorted(p.name for p in Path('artifacts').iterdir()) == sorted(expected)
          for name, (size, digest) in expected.items():
              path = Path('artifacts') / name
              h = hashlib.sha256()
              with path.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                      h.update(chunk)
              assert path.stat().st_size == size and h.hexdigest() == digest, name

          before = release()
          existing = {asset['name']: asset for asset in before['assets']}
          warning = '> ⚠️ 这次发布**缺**这些平台的包： macOS —— 对应的打包 job 失败了，去 Actions 看。'
          intro = '各平台安装包已齐全：macOS（Apple Silicon / Intel）、Windows（x64）、Linux（x64 / arm64）。\n\nmacOS 安装包由 [GitHub Actions](https://github.com/Jiawang1209/DAWN-Science/actions/runs/40866568856) 补齐，应用代码与 v0.0.39 一致。'
          assert warning in before['body'] or intro in before['body'], 'Unexpected Release notes; inspect before editing'
          for name, (size, digest) in expected.items():
              if name in existing:
                  assert existing[name]['size'] == size and existing[name]['digest'] == 'sha256:' + digest, name
              else:
                  print('Uploading ' + name, flush=True)
                  run('gh', 'release', 'upload', tag, str(Path('artifacts') / name), '--repo', repo)

          after = release()
          actual = {asset['name']: asset for asset in after['assets']}
          for name, asset in existing.items():
              assert actual[name]['size'] == asset['size'] and actual[name]['digest'] == asset['digest'], name
          for name, (size, digest) in expected.items():
              assert actual[name]['state'] == 'uploaded'
              assert actual[name]['size'] == size and actual[name]['digest'] == 'sha256:' + digest, name
          assert len(actual) == 10, sorted(actual)
          notes = before['body'].replace(warning, intro)
          notes_file = Path(os.environ['RUNNER_TEMP']) / 'dawn-v0039-release-notes.md'
          notes_file.write_text(notes + '\n', encoding='utf-8')
          run('gh', 'release', 'edit', tag, '--repo', repo, '--notes-file', str(notes_file))
          assert release()['body'].strip() == notes.strip()
          print('Release repaired: all 10 installer/archive assets verified; existing files preserved.')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('v0.0.39 macOS assets restored and SHA-256 verified.\n\n' + after['url'] + '\n')
          PY
