name: credential protection
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/setup-secret-guard.mjs --no-hooks
      - run: node --test scripts/secret-guard.test.mjs
      - run: node scripts/secret-guard.mjs --all
      - name: Check incoming history and tag messages
        env:
          DAWN_SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DAWN_SCAN_REF: ${{ github.ref }}
        run: node scripts/secret-guard.mjs --ci
