# 三平台四份打包矩阵（打包 spec §8）。
# 触发：打 tag `v*` 自动打包并发 GitHub Release（草稿，人看一眼再点「发布」）；手动触发只出 artifacts 不发。
# 不签名（作者定的：先不花那 99 美元，用户右键打开）；有证书时在 electron-builder.yml 删 identity: null 并设 CSC_* secrets。
# Linux 两种架构各在各自的 runner 上打——node-pty 没有 linux 预编译件，只能现场编本机那一种。
#
# **这条工作流不跑测试**（2026-09-05 拆的）。测试在 `ci.yml`，红了归它红。
# 理由是踩出来的：测试与打包同在一个 job 时，Linux 那两台在测试步骤超时，
# `release` 的 `needs: package` 于是永不满足——**mac 与 Windows 明明打成功了，产物却只留在
# artifacts 里七天后自动删除，Release 一个都没出过**。验不该有权否决发。
name: package
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, name: mac, cmd: "npx electron-builder --mac --publish never" }
          - { os: windows-2022, name: win, cmd: "npx electron-builder --win --publish never" }
          - { os: ubuntu-22.04, name: linux-x64, cmd: "npx electron-builder --linux --x64 --publish never" }
          - { os: ubuntu-22.04-arm, name: linux-arm64, cmd: "npx electron-builder --linux --arm64 --publish never" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Linux 打包机依赖（node-pty 现场编译 + AppImage 工具）
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 libfuse2
      - run: npm ci
      # 打包前只做这一道静态检查：它几秒钟，且能挡住「构建产物根本编译不过」这类事。
      # 完整测试在 ci.yml，不在这里——见文件头。
      - run: npm run typecheck
      # **tag 与 package.json 的版本必须一致**：不一致时打出来的文件名是旧版本号
      # （`DAWN-Science-<version>-…`），而 Release 的标题是 tag——发出去的包与它的名字对不上，
      # 装到用户机器上「关于」里显示的还是旧版本。宁可在这里红，也不要发一套名字撒谎的包。
      - name: tag 与 package.json 的版本要对得上
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag 是 v$TAG，而 package.json 里是 $PKG。先改 package.json 的 version 再打 tag。"
            exit 1
          fi
          echo "版本一致：$PKG"
      - run: npm run build
      - run: ${{ matrix.cmd }}
      - uses: actions/upload-artifact@v4
        with:
          name: dawn-science-${{ matrix.name }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 7
  release:
    needs: package
    # **有一个平台没打出来也要发**（2026-09-05）：`needs` 只保证 package 全部结束，
    # `always()` 让这一步在其中某个失败时照样跑。少一个平台的包，好过一个平台都没有——
    # 下面「数一数收到几个」会把缺谁写在 Release 说明里，不蒙人。
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      # 步骤 id 与 shell 变量名只能是 ASCII（actionlint / shellcheck 都会拒中文标识符）；
      # 注释与给人看的话照旧中文。
      - name: 收到哪些包、缺哪些
        id: inventory
        shell: bash
        run: |
          ls -lh artifacts || true
          missing=""
          check() {
            if ! compgen -G "artifacts/$1" > /dev/null; then missing="$missing $2"; fi
          }
          check "*.dmg" "macOS"
          check "*.exe" "Windows"
          check "*.AppImage" "Linux AppImage"
          check "*.deb" "Linux deb"
          # 一个都没有就没什么可发的，如实红
          if ! compgen -G "artifacts/*" > /dev/null; then
            echo "::error::一个产物都没收到，四个平台全失败了"
            exit 1
          fi
          {
            echo "note<<EOF"
            if [ -n "$missing" ]; then
              echo "> ⚠️ 这次发布**缺**这些平台的包：$missing —— 对应的打包 job 失败了，去 Actions 看。"
            else
              echo "四个平台的包都在。"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$missing" ]; then echo "::warning::这次发布缺这些平台的包：$missing"; fi
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          body: ${{ steps.inventory.outputs.note }}
          files: |
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.exe
            artifacts/*.AppImage
            artifacts/*.deb
