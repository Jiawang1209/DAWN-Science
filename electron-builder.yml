# 打包配置（2026-08-27，spec `docs/superpowers/specs/2026-08-27-打包-design.md`）。
# 三条定下的：v1 不用 asar（§2）、不签名（有证书时删 identity: null 并设 CSC_LINK）、各平台在各自机器上打。
appId: science.dawn.app
productName: DAWN Science
executableName: DAWN Science
artifactName: DAWN-Science-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: packaging
# 原生 .node、spawn-helper、被 spawn 的 subagent-child.js / dawn-mcp-server.mjs、pi 按目录扫的 skills/ agents/
# ——全都要在真实磁盘上；asar 里能不能被 ELECTRON_RUN_AS_NODE 的子进程读到没验过，不验的不进 v1
asar: false
# 四个原生模块全是 N-API 预编译件（按平台目录自选），不需要按 Electron ABI 重编；
# 开着的话 electron-builder 会去编 ssh2 的可选依赖 cpu-features（没有预编译件）——第一次打包就死在这（2026-08-27）
npmRebuild: false
files:
  - dist/**
  - skills/**
  - agents/**
  - package.json
  - "!**/*.map"
  - "!node_modules/playwright-core/.local-browsers/**"
  # 别想着按目录名剪 node_modules（2026-08-27 踩的）：`yaml` 包的代码就在 `dist/doc/` 里，剪掉它主进程起不来
mac:
  category: public.app-category.developer-tools
  target:
    - { target: dmg, arch: [arm64, x64] }
    - { target: zip, arch: [arm64, x64] }
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: packaging/entitlements.mac.plist
  entitlementsInherit: packaging/entitlements.mac.plist
  # ad-hoc 签名（`-`），不是不签名。**别改回 null**（2026-09-15 抓的）：null 时 electron-builder 完全跳过签名，
  # 而它改过 Info.plist、改过可执行文件名，Electron 自带的签名就碎了——Apple Silicon 上带下载标记的
  # 碎签名 App，Finder 直接报「已损坏，应移到废纸篓」，右键打开也不给开。ad-hoc 签名之后退化成
  # 「无法验证开发者」，右键打开 / 隐私与安全性里「仍要打开」能过。hardenedRuntime + ad-hoc 要求
  # entitlements 里有 disable-library-validation（已有）。有 Developer ID 时：改成证书名，设 CSC_LINK / CSC_KEY_PASSWORD，再加 notarize
  identity: "-"
dmg:
  title: DAWN Science
  contents:
    - { x: 160, y: 170, type: file }
    - { x: 400, y: 170, type: link, path: /Applications }
win:
  target: [nsis, portable]
  signAndEditExecutable: false
# 便携版单独起名——与安装器同名时后打的会把先打的盖掉（2026-08-27 在 mac 上交叉打 win 时发现）
portable:
  artifactName: DAWN-Science-${version}-${os}-${arch}-portable.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
# Linux 只能在 Linux 上打：node-pty 的 npm 包不带 linux 预编译件（`npm ci` 时现场编译，要 build-essential + python3）；
# 从 mac 交叉出来的 AppImage 终端会哑。x64 与 arm64 各在各的 runner 上打（CI 用 --x64 / --arm64 选），
# 因为 node-pty 只能编出本机那一种架构。`.deb` 要求 package.json 有 homepage（已填仓库地址）。
linux:
  category: Science
  maintainer: DAWN Science
  synopsis: Multi-agent data-science workbench
  target: [AppImage, deb]
