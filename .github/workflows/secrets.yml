name: credential protection
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/setup-secret-guard.mjs --no-hooks
      - run: node --test scripts/secret-guard.test.mjs
      - run: node scripts/secret-guard.mjs --all
      - name: Check incoming commit history
        env:
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [[ "$BEFORE" =~ ^[a-f0-9]{40}$ && ! "$BEFORE" =~ ^0+$ ]]; then
            node scripts/secret-guard.mjs --range "$BEFORE..$(git rev-parse HEAD)"
          fi
